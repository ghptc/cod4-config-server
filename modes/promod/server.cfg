// Promod LIVE 2.20: capacity, identity, rules and compatible map rotation.
set sv_hostname "CoD4 Promod Server"
set sv_maxclients "12"
set g_gametype "sd"
set promod_mode "match_mr12_pb"
set sv_mapRotation "gametype sd map mp_crash gametype sd map mp_strike gametype sd map mp_crossfire gametype sd map mp_backlot"

// Native shuffled rotation; match-end exit remains distinct from S&D rounds.
set sv_randomMapRotation "1"
set promod_auto_maprotate "1"
