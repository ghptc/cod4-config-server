// Promod LIVE 2.20: capacity, identity, rules and compatible map rotation.
// Override shared: sv_pure
set sv_pure "1"
set sv_hostname "CoD4 Promod Server"
set sv_maxclients "12"
set g_gametype "sd"
set promod_mode "match_mr12_pb"
// Official pool: 20 standard/DLC maps plus installed Winter Crash.
// Qualified 2026-10-26: S&D bombsites, bot navigation/fire, native voting,
// same-map round restarts and completed-match exits on all 21 maps.
// Single authoritative catalog; mode rules execute after private CFGs.
set sv_mapRotation "gametype sd map mp_backlot gametype sd map mp_bloc gametype sd map mp_bog gametype sd map mp_broadcast gametype sd map mp_carentan gametype sd map mp_cargoship gametype sd map mp_citystreets gametype sd map mp_convoy gametype sd map mp_countdown gametype sd map mp_crash gametype sd map mp_crash_snow gametype sd map mp_creek gametype sd map mp_crossfire gametype sd map mp_farm gametype sd map mp_killhouse gametype sd map mp_overgrown gametype sd map mp_pipeline gametype sd map mp_shipment gametype sd map mp_showdown gametype sd map mp_strike gametype sd map mp_vacant"

// Native shuffled rotation; match-end exit remains distinct from S&D rounds.
set sv_randomMapRotation "1"
set promod_auto_maprotate "1"

// Native human-only next-map ballots; Promod preparation preserves this policy.
set g_oldVoting "1"
set g_allowVote "1"
set g_voteAllowMap "1"
set g_voteAllowMaprotate "1"
set g_voteAllowRestart "0"
set g_voteAllowGametype "0"
set g_voteAllowKick "0"
set g_voteTime "30"
set g_voteMaxVotes "2"
set g_voteAbstainWeight "1"
set g_voteCooldown "5"

// Mode owns the existing Bot Warfare auto-fill policy.
set bot_enable "1"
set bot_fill_limit "12"
set sv_mapRotationCurrent ""

// Names apply at bot creation; native S&D interactions keep Promod timers.
set bot_use_names "1"
set bot_sd_objectives "1"
