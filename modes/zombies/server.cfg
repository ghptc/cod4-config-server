// Before the Dawn Alpha 001. Private original assets are required.
// Override shared: sv_pure
set sv_pure "1"
set sv_mapRotationCurrent ""
set sv_randomMapRotation "0"
set sv_hostname "CoD4 Before the Dawn Zombies"
set sv_maxclients "12"
set g_gametype "war"
// Original package rotation; District and Killhouse are explicitly unsupported.
set sv_mapRotation "gametype war map mp_convoy gametype war map mp_bloc gametype war map mp_bog gametype war map mp_broadcast gametype war map mp_countdown gametype war map mp_crash gametype war map mp_creek gametype war map mp_crossfire gametype war map mp_farm gametype war map mp_overgrown gametype war map mp_pipeline gametype war map mp_showdown gametype war map mp_strike gametype war map mp_vacant gametype war map mp_cargoship"
// Zombies are provided by BTD; never attach the Promod Bot Warfare integration.
set bot_enable "0"
set g_allowVote "0"
set g_oldVoting "0"
set scr_teambalance "0"
set scr_war_scorelimit "0"
set scr_war_timelimit "0"
set scr_war_playerrespawndelay "5"
// Mode-owned wave policy, using the original package's shipped settings.
set btd_grace_time "60"
set btd_wave_settings "1"
set btd_zombiewaves "15"
set btd_maxzombies "50"
set btd_zombiehealth "150"
set btd_random_spawns "1"
set btd_zomdmg "5"
set btd_music "0"
